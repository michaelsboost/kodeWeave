<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kodeWeave · Shared Project</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0b101b;color:#e2e8f0}#preview{display:none;border:0;width:100%;height:100%;position:fixed;inset:0;background:white}#status{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#1d2941 0%,#0b101b 65%)}.panel{width:min(440px,100%);text-align:center;padding:38px 28px;border:1px solid #334155;border-radius:24px;background:#121b2b;box-shadow:0 20px 80px #0005}.logo{width:64px;height:64px;margin:0 auto 20px}.eyebrow{color:#38bdf8;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}h1{font-size:27px;letter-spacing:-.04em;margin:12px 0}p{line-height:1.65;color:#94a3b8;margin:0 0 25px}a{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;background:#0ea5e9;color:white;text-decoration:none;border-radius:12px;font-weight:650}a:hover{background:#0284c7}</style></head><body><main id="status"><section class="panel"><img class="logo" src="../imgs/logo.svg" alt="kodeWeave"><div class="eyebrow">kodeWeave / Share</div><h1 id="heading">No project detected</h1><p id="detail">This link doesn't contain a project to preview. Open kodeWeave to create or explore a project.</p><a href="../go/">Launch kodeWeave</a></section></main><iframe id="preview" title="Shared project preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads" referrerpolicy="strict-origin-when-cross-origin"></iframe><script type="module">
const status=document.getElementById('status'),preview=document.getElementById('preview');
function error(title,message){document.getElementById('heading').textContent=title;document.getElementById('detail').textContent=message;status.style.display='grid';preview.style.display='none'}
function safe(value){return String(value??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
async function main(){const param=new URLSearchParams(location.search).get('project');if(!param)return;try{let url=new URL(param,location.href);if(!['https:','http:'].includes(url.protocol))throw Error('Unsupported project URL');const gh=url.hostname==='github.com'&&url.pathname.match(/^\/([^/]+)\/([^/]+?)(?:\.git)?\/?$/);if(gh){const infoResponse=await fetch('https://api.github.com/repos/'+encodeURIComponent(gh[1])+'/'+encodeURIComponent(gh[2]));if(!infoResponse.ok)throw Error('Unable to inspect GitHub repository');const info=await infoResponse.json();const root='https://raw.githubusercontent.com/'+encodeURIComponent(gh[1])+'/'+encodeURIComponent(gh[2])+'/'+encodeURIComponent(info.default_branch)+'/';let found=false;for(const name of ['kodeweave.json','kodeWeave.json','project.json','index.html']){const candidate=new URL(name,root);const test=await fetch(candidate);if(test.ok){url=candidate;found=true;break}}if(!found)throw Error('No project JSON or index.html found at the GitHub repository root')}error('Loading project…','Preparing your shared preview.');const response=await fetch(url);if(!response.ok)throw Error('Project file could not be fetched ('+response.status+').');const raw=await response.text();let project;if(/\.html?(?:$|[?#])/i.test(url.pathname)){project={title:'Shared HTML Project',html:raw,css:'',javascript:'',libraries:[],meta:''}}else{project=JSON.parse(raw);if(!project||typeof project.html!=='string')throw Error('Invalid kodeWeave project format');if(['html','css','javascript'].some(k=>project[k+'_pre_processor']&&project[k+'_pre_processor']!==k))throw Error('This project uses preprocessors. Export compiled HTML to share it.')}const styles=[],scripts=[];for(const lib of (Array.isArray(project.libraries)?project.libraries:[])){if(typeof lib!=='string'||!/^https?:\/\//i.test(lib))continue;if(/\.js(?:[?#]|$)/i.test(lib))scripts.push('<script src="'+safe(lib)+'"><\/script>');else styles.push('<link rel="stylesheet" href="'+safe(lib)+'">')}const html='<!doctype html><html data-theme="'+(project.previewDark?'dark':'light')+'"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+safe(project.title||project.name||'Shared Project')+'</title>'+(project.meta||'')+styles.join('')+'<style>'+(project.css||'').replaceAll('</style','<\/style')+'</style></head><body>'+(project.html||'')+scripts.join('')+'<script type="'+(project.module?'module':'text/javascript')+'">'+(project.javascript||'').replaceAll('</script','<\/script')+'<\/script></body></html>';preview.srcdoc=html;status.style.display='none';preview.style.display='block';}catch(e){error('Unable to load project',e.message||'Check the project URL and try again.')}}main();
</script></body></html>
